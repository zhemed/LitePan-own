name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps
        working-directory: web
        run: npm ci --include=dev
      - name: Type check
        working-directory: web
        run: npm run type-check
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Audit (allow xlsx high)
        working-directory: web
        run: npm audit --audit-level=high || echo "audit: xlsx GHSA accepted, see README"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - name: Go vet
        run: GOWORK=off go vet ./...
      - name: Go test -race
        run: GOWORK=off go test -race ./... -count=1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
