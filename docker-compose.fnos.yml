# Docker 环境标准：Docker 29.7.2 + Compose v5.4.0（部署前运行 ./check-docker-env.sh 校验）
services:
  litepan:
    build: .
    container_name: litepan
    environment:
      - TZ=Asia/Shanghai
      - LITEPAN_DATA_DIR=/app/data
      - LITEPAN_LISTEN=:5211
      - LITEPAN_LOG_LEVEL=info
      - 'LITEPAN_LOCAL_SOURCES={"临时-1":"/vol1/1000/临时-1","临时-2":"/vol2/1000/临时-2","pve_backup":"/vol1/1000/pve_backup","spare_backup":"/vol2/1000/spare_backup"}'
    volumes:
      - /vol1/1000/litepan/data:/app/data
      - /vol1/1000/litepan/mounts:/app/mounts:shared
      - /vol1/1000:/vol1/1000
      - /vol2/1000:/vol2/1000
      - /usr/trim/var/backup_service:/usr/trim/var/backup_service:ro
    devices:
      - /dev/fuse:/dev/fuse
    privileged: true
    pid: "host"
    network_mode: "host"
    restart: always
